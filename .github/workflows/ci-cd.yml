name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  #  Job 1: Build & Test
  # ============================================
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ---- Back-end ----
      - name: 📦 Instalar dependências (backend)
        working-directory: ./backend
        run: npm ci

      - name: 🔨 Build (backend)
        working-directory: ./backend
        run: |
          npx prisma generate
          npm run build

      - name: 🧪 Testes (backend)
        working-directory: ./backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-ci
          DATABASE_URL: postgresql://localhost:5432/test_db

      # ---- Front-end ----
      - name: 📦 Instalar dependências (frontend)
        working-directory: ./frontend
        run: npm ci

      - name: 🔨 Build (frontend)
        working-directory: ./frontend
        run: npm run build

      - name: 🧪 Testes (frontend)
        working-directory: ./frontend
        run: npm test

      # ---- Upload de artefatos ----
      - name: 📤 Upload build do frontend
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ============================================
  #  Job 2: Deploy Back-end (Docker)
  # ============================================
  deploy-backend:
    name: 🐳 Deploy Back-end
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔐 Login no Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build e Push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}

      - name: 🚀 Deploy no servidor
        run: |
          echo "============================================"
          echo "🚀 Deploy automático do back-end"
          echo "============================================"
          echo "Imagem: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}"
          echo ""
          echo "Para ativar o deploy real, configure os secrets:"
          echo "  - DOCKER_REGISTRY (ex: ghcr.io)"
          echo "  - DOCKER_USERNAME"
          echo "  - DOCKER_PASSWORD"
          echo "  - DOCKER_IMAGE_NAME (ex: usuario/reservas-api)"
          echo "============================================"

  # ============================================
  #  Job 3: Deploy Front-end (Vercel)
  # ============================================
  deploy-frontend:
    name: 🔺 Deploy Front-end
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Instalar dependências
        working-directory: ./frontend
        run: npm ci

      - name: 🔨 Build de produção
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: 🔺 Deploy para Vercel
        run: |
          echo "============================================"
          echo "🔺 Deploy automático do front-end"
          echo "============================================"
          echo "Build disponível em frontend/dist/"
          echo ""
          echo "Para ativar o deploy real, configure:"
          echo "  - VERCEL_TOKEN"
          echo "  - VERCEL_ORG_ID"
          echo "  - VERCEL_PROJECT_ID"
          echo "  - VITE_API_URL (URL da API em produção)"
          echo "============================================"
